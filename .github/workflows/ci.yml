name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go build, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentbox_test
          POSTGRES_PASSWORD: agentbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTBOX_TEST_DATABASE_URL: postgres://postgres:agentbox@127.0.0.1:5432/agentbox_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        working-directory: server
        run: go build ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Scan Go dependencies for reachable vulnerabilities
        working-directory: server
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags agentbox_driver ./internal/httpapi/assets/agentbox-microsandbox-driver
      - name: Check Worker package boundary
        working-directory: server
        run: |
          dependencies=$(go list -deps ./cmd/agentbox-worker)
          if printf '%s\n' "$dependencies" | grep -Eq '^agentbox/internal/(httpapi|store)$'; then
            echo 'Worker must not depend on the HTTP API or database store.'
            exit 1
          fi
      - name: Test
        working-directory: server
        run: go test -count=1 ./...
      - name: Test Microsandbox driver
        working-directory: server
        run: go test -count=1 -tags agentbox_driver ./internal/httpapi/assets/agentbox-microsandbox-driver
      - name: Build source Server image with bundled Workers
        run: docker build --build-arg VERSION=dev -t agentbox-server-source-smoke ./server
      - name: Verify bundled Worker assets
        run: |
          docker run --rm --entrypoint sh agentbox-server-source-smoke -ec '
            test -x /usr/local/lib/agentbox/workers/agentbox-worker-linux-amd64
            test -x /usr/local/lib/agentbox/workers/agentbox-worker-linux-arm64
            test -r /usr/local/lib/agentbox/workers/agentbox-worker-linux-amd64.sha256
            test -r /usr/local/lib/agentbox/workers/agentbox-worker-linux-arm64.sha256
            test "$AGENTBOX_WORKER_BINARY_DIR" = /usr/local/lib/agentbox/workers
          '
          docker run --rm \
            --entrypoint /usr/local/lib/agentbox/workers/agentbox-worker-linux-amd64 \
            agentbox-server-source-smoke version | grep -Fx dev

  worker-docker:
    name: Session Worker Docker data-plane E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Exercise Docker lifecycle and real Session Worker RPC
        working-directory: server
        env:
          AGENTBOX_DOCKER_E2E: "1"
        run: |
          set -o pipefail
          output_path="${RUNNER_TEMP}/agentbox-docker-e2e.log"
          go test -v -count=1 ./internal/sessionworker -run '^TestDockerSessionWorkerDataPlaneE2E$' | tee "${output_path}"
          grep -q -- '--- PASS: TestDockerSessionWorkerDataPlaneE2E' "${output_path}"

  web:
    name: Web lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        working-directory: app
        run: pnpm audit --audit-level=moderate
      - name: Lint
        working-directory: app
        run: pnpm lint
      - name: Typecheck
        working-directory: app
        run: pnpm typecheck
      - name: Test
        working-directory: app
        run: pnpm test
      - name: Build
        working-directory: app
        env:
          AGENTBOX_API_URL: http://127.0.0.1:18091
        run: pnpm build
      - name: Install Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop end-to-end tests
        working-directory: app
        run: pnpm test:e2e
